name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install mdBook 0.5.4
        env:
          MDBOOK_ARCHIVE: mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/${MDBOOK_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/${MDBOOK_ARCHIVE}" \
            --output "${archive_path}"
          echo "${MDBOOK_SHA256}  ${archive_path}" | sha256sum --check --strict
          tar -xzf "${archive_path}" --directory "${RUNNER_TEMP}" mdbook
          chmod 0755 "${RUNNER_TEMP}/mdbook"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Build both books and check links
        run: npm run docs:check
      - name: Upload checked Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs
          retention-days: 7
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
