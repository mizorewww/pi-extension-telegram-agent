name: Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Verify cache protocol golden
        run: npm run build && node --import ./dist/test/network-guard.js --test dist/test/cache.test.js
      - name: Run offline test suite
        run: npm test
      - name: Type-check
        run: npm run check
      - name: Lint and format check
        run: npm run lint
